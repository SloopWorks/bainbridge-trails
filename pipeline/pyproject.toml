[project]
name = "bitrails"
version = "0.1.0"
description = "Bainbridge Island trail data pipeline"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.31",
    "pyyaml>=6.0",
    "rasterio>=1.5.2",
    "numpy>=2.5.4",
]

[project.scripts]
bitrails = "bitrails.cli:main"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25"]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
