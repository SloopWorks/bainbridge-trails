name: CI

# Map data (data/dist/, synced into composeResources) is gitignored and built by pipeline/ + tippecanoe, which is
# too heavy for CI. The app compiles without it and the real-dataset tests in :coverage report as skipped
# (assumeDataFiles). See app/AGENTS.md "CI".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Plain clone: no SloopWorks debug drawer checkout; force the in-repo no-op shim explicitly.
  ORG_GRADLE_PROJECT_debugDrawer: "off"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests + debug + release (R8) builds, both goal flavours (RD-1)
        # No signing secrets in CI: release builds androidApp-release-unsigned.apk, which still runs R8/shrinking.
        run: >-
          ./gradlew --stacktrace -PdebugDrawer=off
          :coverage:jvmTest :tracking:jvmTest :composeApp:testAndroidHostTest
          :androidApp:assembleTrailsDebug :androidApp:assembleRoadsDebug
          :androidApp:assembleTrailsRelease :androidApp:assembleRoadsRelease
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/**/build/reports/tests/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Store metadata limits
        working-directory: .
        run: python3 scripts/check-metadata.py

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Xcode version
        run: xcodebuild -version
      - name: Link simulator framework
        working-directory: app
        run: ./gradlew --stacktrace -PdebugDrawer=off :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Simulator build (unsigned)
        # The project's build phase runs :composeApp:embedAndSignAppleFrameworkForXcode itself (JAVA_HOME from setup-java).
        run: >-
          xcodebuild -project app/iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/bt-dd"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
