# Bainbridge Island trail data sources (survey 2026-10-18). Top-level key: sources.
# Required per entry: id, name, url, kind (overpass|arcgis_rest|geojson|pdf_map|elevation|reference_only),
#   endpoint, license, redistribution (yes|no|unknown), attribution.
# endpoint: exactly ONE bare http(s) URL, or null for pure reference entries. Prose belongs in notes.
# Optional: geometry_rank (int, lower = preferred geometry), notes,
#   format (geojson|json|shapefile_zip|pdf|html|tiff) = response/download format of endpoint,
#   query = for kind overpass: Overpass QL sent as the POST body (form field data=); otherwise a percent-encoded URL query string
#           to append to endpoint after '?' ({lon}/{lat} are literal placeholders to substitute).
sources:
- id: osm_overpass_trails
  name: OpenStreetMap trails/paths via Overpass API
  url: https://www.openstreetmap.org/copyright
  kind: overpass
  endpoint: https://overpass-api.de/api/interpreter
  license: 'ODbL 1.0. osm.org/copyright: "You are free to copy, distribute, transmit and adapt our data,
    as long as you credit OpenStreetMap and its contributors." Derived databases must stay under ODbL
    (share-alike).'
  redistribution: 'yes'
  attribution: (c) OpenStreetMap contributors, ODbL 1.0 - https://www.openstreetmap.org/copyright
  geometry_rank: 1
  notes: 'Query is the minimum set: also decide downstream about highway=service/living_street/residential
    footways and sidewalks (footway=sidewalk|crossing); trailheads/parking: nwr["amenity"="parking"],
    nwr["highway"="trailhead"], leisure=park|nature_reserve. POST form field data= with a User-Agent header
    (default curl UA gets 406). Public instance often returns 502 "at capacity": retry with backoff or
    use mirror https://maps.mail.ru/osm/tools/overpass/api/interpreter. Area id = 3600000000 + relation
    id = 3603148366. Query: [out:json][timeout:90];rel(3148366);map_to_area->.a;(way["highway"~"^(path|footway|track|bridleway|cycleway|steps|pedestrian)$"](area.a););out
    geom tags; Tested 2026-10-18: 4978 ways (path|footway|track|bridleway|cycleway|steps) in island area
    (many are sidewalks/driveways; classify via tags highway, footway=sidewalk/crossing, access, foot,
    bicycle, surface, name, operator). Also pull route relations: rel["route"~"hiking|foot|bicycle"](area.a);
    and trailheads/parking: nwr["amenity"="parking"], nwr["leisure"="park|nature_reserve"], nwr["highway"="trailhead"].
    Mixed ODbL share-alike: keep OSM-derived layer attributable; do not blend into a combined derived
    DB without ODbL review.'
  query: '[out:json][timeout:180];rel(3148366);map_to_area->.a;(way["highway"~"^(path|footway|track|bridleway|cycleway|steps|pedestrian)$"](area.a);rel["route"~"^(hiking|foot)$"](area.a););out
    geom;'
  format: json
- id: osm_island_boundary
  name: Bainbridge Island land boundary (OSM relation 3148366, place=island)
  url: https://www.openstreetmap.org/relation/3148366
  kind: overpass
  endpoint: https://overpass-api.de/api/interpreter
  license: 'ODbL 1.0 (same as OSM). Verified via Nominatim lookup R3148366: place=island, wikidata Q803903,
    bbox S47.5740930 N47.7212543 W-122.5928063 E-122.4793619.'
  redistribution: 'yes'
  attribution: (c) OpenStreetMap contributors, ODbL 1.0
  geometry_rank: 1
  notes: 'PRIMARY island land boundary. Alternates: City of Bainbridge Island jurisdictional boundary
    = OSM admin relation 237327 (includes water; not land-only) and the City Shoreline shapefile (cobi_shoreline_shp).
    Island also includes small offshore islands? Only the main island is relation 3148366.'
  query: '[out:json][timeout:60];rel(3148366);out geom;'
  format: json
- id: cobi_public_trails_all
  name: City of Bainbridge Island - merged public trails (BIMPRD + COBI), layer 0
  url: https://gis.bainbridgewa.gov/server/rest/services/Landuse/_rd_public_trails_all/FeatureServer
  kind: arcgis_rest
  endpoint: https://gis.bainbridgewa.gov/server/rest/services/Landuse/_rd_public_trails_all/FeatureServer/0/query
  license: 'Layer item description (iteminfo licenseInfo): "This data is for general planning and recreational
    reference. Not for legal boundary or navigation purposes. Users are responsible for verifying accuracy
    before use in decision-making." No explicit reuse/redistribution license stated. accessInformation:
    "BIMPRD, City of Bainbridge Island".'
  redistribution: unknown
  attribution: BIMPRD and City of Bainbridge Island (GIS)
  geometry_rank: 2
  notes: 'Verified HTTP 200 (ArcGIS Server 11.5). Layer 0 ".rd_public_trails_all", esriGeometryPolyline,
    has Z (zmin -2.6..zmax 113.3 ft), native SR wkid 103180/6597 (NAD83(2011) WA North ftUS; pass outSR=4326),
    maxRecordCount 2000, formats JSON/geoJSON/PBF, count=373 (returnCountOnly 2026-10-18). Fields: TRAILNAME,
    PARK, TRAIL_SYST, REGION, MATERIAL (surface), CONDITION, MANAGING_O (owner), HIKING_ALL, BICYCLES_A,
    HORSES_ALL, WATER_TRAI, MOTOR_TRAI, ER_ACCESSI, ADA_ACCESS, NATIONAL_T, REGIONAL_T, LOCAL_TRAI, Class,
    DATA_SOURC (e.g. Catalyst, North Kitsap Trails Association), MERGE_SRC, name, public_, comment, type,
    system, maintained, Trail_lengthFT, Trail_Number, GIS_ID, CG_ID, GlobalID, DATE/SOURCE_DAT/UPDATE_DAT,
    Shape__Length (ft). Sum Shape__Length by MANAGING_O: BIMPRD 91,605 ft; COBI 878 ft; PRIVATE 165 ft;
    null/blank ~36,000 ft. Best structured official trail geometry; Trail_lengthFT mostly null so compute
    length from geometry. Attribute-only queries (returnCountOnly, returnGeometry=false, outStatistics)
    work, but full-geometry f=geojson/f=json queries FAILED when tested 2026-10-18 (first call >120 s
    then killed; later HTTP 500 Web Adaptor error, then HTTP 503 "Wait timeout for the request exceeded"
    after 60 s) - server was wedged/overloaded, so geometry download from this host is UNVERIFIED. Pipeline:
    page with resultOffset/resultRecordCount=100, retry with backoff, fall back to bimprd_trails_agol_2022
    (same schema, hosted AGOL, verified).'
  query: where=1=1&outFields=*&outSR=4326&f=geojson
  format: geojson
